<app-header />

<main class="page-content">

  <div class="breadcrumb">
    {{ categoryTitle }}
  </div>

  <div class="page-header">

    <div class="page-title">
      <h1>{{ categoryTitle }}</h1>
      <span>({{ productCount }}) sonuç</span>
    </div>

    <div class="header-right">
      <button class="filter-button" type="button">
        Filtreler & Sıralama
      </button>

      <div class="view-modes">
        <svg (click)="gridColumns = 1" [class.active]="gridColumns === 1" class="view-icon" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="16" height="16"></rect>
        </svg>

        <svg (click)="gridColumns = 2" [class.active]="gridColumns === 2" class="view-icon" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="6" height="16"></rect>
          <rect x="14" y="4" width="6" height="16"></rect>
        </svg>

        <svg (click)="gridColumns = 3" [class.active]="gridColumns === 3" class="view-icon" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="4" width="6" height="6"></rect>
          <rect x="14" y="4" width="6" height="6"></rect>
          <rect x="4" y="14" width="6" height="6"></rect>
          <rect x="14" y="14" width="6" height="6"></rect>
        </svg>

        <svg (click)="gridColumns = 4" [class.active]="gridColumns === 4" class="view-icon" viewBox="0 0 24 24"
          fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="4" height="4"></rect>
          <rect x="10" y="3" width="4" height="4"></rect>
          <rect x="17" y="3" width="4" height="4"></rect>
          <rect x="3" y="10" width="4" height="4"></rect>
          <rect x="10" y="10" width="4" height="4"></rect>
          <rect x="17" y="10" width="4" height="4"></rect>
          <rect x="3" y="17" width="4" height="4"></rect>
          <rect x="10" y="17" width="4" height="4"></rect>
          <rect x="17" y="17" width="4" height="4"></rect>
        </svg>
      </div>

    </div>

  </div>

  <app-category-nav [categories]="categories" />
  <div class="product-grid" [ngClass]="'grid-' + gridColumns">


    @for (product of products; track product.name) {
    <app-product-card [product]="product" />
    }

  </div>

</main>
